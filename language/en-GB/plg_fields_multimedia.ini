PLG_FIELDS_MULTIMEDIA_LABEL="Multimedia (gallery or files)"
PLG_FIELDS_MULTIMEDIA_XML_DESCRIPTION="A field for an image gallery or a list of files. The mode is chosen when the field is created and cannot be changed after saving. Upload from the computer or pick from the media manager, thumbnails, WT Fancybox viewer (when connected), overridable layouts."
PLG_FIELDS_MULTIMEDIA_MODE="Field mode"
PLG_FIELDS_MULTIMEDIA_MODE_DESC="Gallery - images with thumbnails and a viewer. Files - a list of downloadable documents. Chosen once: the mode cannot be changed after the field is saved."
PLG_FIELDS_MULTIMEDIA_MODE_LOCKED_DESC="The mode was fixed on the first save and cannot be changed. Create a new field to get another mode."
PLG_FIELDS_MULTIMEDIA_MODE_GALLERY="Gallery"
PLG_FIELDS_MULTIMEDIA_MODE_FILES="Files"
PLG_FIELDS_MULTIMEDIA_SECTION_STORAGE="Storage and limits"
PLG_FIELDS_MULTIMEDIA_SECTION_IMAGES="Image processing on upload"
PLG_FIELDS_MULTIMEDIA_SECTION_GALLERY_DISPLAY="Gallery output on the site"
PLG_FIELDS_MULTIMEDIA_SECTION_FILES="Files and their output on the site"
PLG_FIELDS_MULTIMEDIA_DIRECTORY="Upload folder"
PLG_FIELDS_MULTIMEDIA_DIRECTORY_DESC="A subfolder of images/ where uploaded files are stored. Latin letters, digits, hyphen and underscore, up to four levels, for example products/gallery."
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS="Subfolders"
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_DESC="Sort uploaded files into nested folders."
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_NONE="No subfolders"
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_MONTH="By year and month (2026/10)"
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_FIELD="By field name"
PLG_FIELDS_MULTIMEDIA_MAX_FILES="Maximum items"
PLG_FIELDS_MULTIMEDIA_MAX_FILES_DESC="How many files the field may hold. Use 1 for a single image or document."
PLG_FIELDS_MULTIMEDIA_MAX_SIZE="Maximum file size, MB"
PLG_FIELDS_MULTIMEDIA_MAX_SIZE_DESC="Enforced on the server too. It cannot exceed upload_max_filesize and post_max_size from the PHP settings."
PLG_FIELDS_MULTIMEDIA_DELETE_FILES="Delete files with the record"
PLG_FIELDS_MULTIMEDIA_DELETE_FILES_DESC="When an article (or another record) is deleted, its files are removed from this field's upload folder. Files referenced by another record are kept. Off by default."
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE="Resizing"
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_DESC="Fit - shrink into the frame keeping proportions. Crop - crop from the center to the exact frame proportions. Small images are never enlarged."
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_NONE="Keep as is"
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_CONTAIN="Fit into the frame"
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_COVER="Crop to the frame"
PLG_FIELDS_MULTIMEDIA_IMAGE_WIDTH="Frame width, px"
PLG_FIELDS_MULTIMEDIA_IMAGE_HEIGHT="Frame height, px"
PLG_FIELDS_MULTIMEDIA_IMAGE_QUALITY="Quality, %"
PLG_FIELDS_MULTIMEDIA_IMAGE_QUALITY_DESC="JPEG and WebP quality when the image is re-saved. 80-90 is recommended. Re-saving strips metadata (EXIF, GPS tags)."
PLG_FIELDS_MULTIMEDIA_IMAGE_WEBP="Convert to WebP"
PLG_FIELDS_MULTIMEDIA_IMAGE_WEBP_DESC="Uploaded JPEG and PNG files are stored as WebP (PHP must support WebP). Animated GIFs are left unchanged. Images picked from the media manager are not converted."
PLG_FIELDS_MULTIMEDIA_GALLERY_LAYOUT="Gallery layout"
PLG_FIELDS_MULTIMEDIA_GALLERY_LAYOUT_GRID="Grid"
PLG_FIELDS_MULTIMEDIA_GALLERY_LAYOUT_SLIDER="Slider"
PLG_FIELDS_MULTIMEDIA_COLUMNS="Columns on a wide screen"
PLG_FIELDS_MULTIMEDIA_COLUMNS_DESC="A tablet shows at most two columns, a phone shows one."
PLG_FIELDS_MULTIMEDIA_THUMB_WIDTH="Thumbnail width, px"
PLG_FIELDS_MULTIMEDIA_THUMB_HEIGHT="Thumbnail height, px"
PLG_FIELDS_MULTIMEDIA_THUMB_DESC="Thumbnails are created on first view and cached in images/multimedia-cache. Set the width to 0 to output originals."
PLG_FIELDS_MULTIMEDIA_SHOW_CAPTIONS="Show captions under images"
PLG_FIELDS_MULTIMEDIA_LIGHTBOX="Open large on click"
PLG_FIELDS_MULTIMEDIA_LIGHTBOX_DESC="If the WT Fancybox plugin is enabled on the site, images open through it. Otherwise the built-in viewer is used. No external networks (CDN) are loaded."
PLG_FIELDS_MULTIMEDIA_SLIDER_AUTOPLAY="Autoplay, seconds"
PLG_FIELDS_MULTIMEDIA_SLIDER_AUTOPLAY_DESC="0 - off. Pauses on hover and when the system 'reduce motion' setting is on."
