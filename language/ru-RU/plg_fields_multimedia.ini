PLG_FIELDS_MULTIMEDIA_LABEL="Мультимедиа (галерея или файлы)"
PLG_FIELDS_MULTIMEDIA_XML_DESCRIPTION="Поле для галереи изображений или списка файлов. Режим выбирается при создании поля и после сохранения не меняется. Загрузка с компьютера и выбор из менеджера медиа, миниатюры, просмотр через WT Fancybox (если подключён), переопределяемые макеты."
PLG_FIELDS_MULTIMEDIA_MODE="Режим поля"
PLG_FIELDS_MULTIMEDIA_MODE_DESC="Галерея — изображения с миниатюрами и просмотром. Файлы — список документов для скачивания. Выбирается один раз: после сохранения поля режим изменить нельзя."
PLG_FIELDS_MULTIMEDIA_MODE_LOCKED_DESC="Режим закреплён при первом сохранении и не меняется. Чтобы получить другой режим, создайте новое поле."
PLG_FIELDS_MULTIMEDIA_MODE_GALLERY="Галерея"
PLG_FIELDS_MULTIMEDIA_MODE_FILES="Файлы"
PLG_FIELDS_MULTIMEDIA_SECTION_STORAGE="Хранение и ограничения"
PLG_FIELDS_MULTIMEDIA_SECTION_IMAGES="Обработка изображений при загрузке"
PLG_FIELDS_MULTIMEDIA_SECTION_GALLERY_DISPLAY="Вывод галереи на сайте"
PLG_FIELDS_MULTIMEDIA_SECTION_FILES="Файлы и их вывод на сайте"
PLG_FIELDS_MULTIMEDIA_DIRECTORY="Папка загрузки"
PLG_FIELDS_MULTIMEDIA_DIRECTORY_DESC="Подпапка внутри images/, куда сохраняются загруженные файлы. Допустимы латиница, цифры, дефис, подчёркивание и вложенность до четырёх уровней, например products/gallery."
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS="Подпапки"
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_DESC="Раскладывать загруженные файлы по вложенным папкам."
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_NONE="Без подпапок"
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_MONTH="По году и месяцу (2026/10)"
PLG_FIELDS_MULTIMEDIA_SUBFOLDERS_FIELD="По имени поля"
PLG_FIELDS_MULTIMEDIA_MAX_FILES="Максимум элементов"
PLG_FIELDS_MULTIMEDIA_MAX_FILES_DESC="Сколько файлов можно добавить в поле. Для одного изображения или документа укажите 1."
PLG_FIELDS_MULTIMEDIA_MAX_SIZE="Максимальный размер файла, МБ"
PLG_FIELDS_MULTIMEDIA_MAX_SIZE_DESC="Действует и на сервере. Не может превышать upload_max_filesize и post_max_size в настройках PHP."
PLG_FIELDS_MULTIMEDIA_DELETE_FILES="Удалять файлы вместе с записью"
PLG_FIELDS_MULTIMEDIA_DELETE_FILES_DESC="При удалении материала (или другой записи) удаляются его файлы из папки загрузки этого поля. Файлы, на которые ссылается другая запись, остаются. По умолчанию выключено."
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE="Изменение размера"
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_DESC="Вписать — уменьшить до рамки с сохранением пропорций. Обрезать — обрезать по центру до точных пропорций рамки. Увеличение мелких изображений не выполняется."
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_NONE="Не менять"
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_CONTAIN="Вписать в рамку"
PLG_FIELDS_MULTIMEDIA_IMAGE_RESIZE_COVER="Обрезать по рамке"
PLG_FIELDS_MULTIMEDIA_IMAGE_WIDTH="Ширина рамки, px"
PLG_FIELDS_MULTIMEDIA_IMAGE_HEIGHT="Высота рамки, px"
PLG_FIELDS_MULTIMEDIA_IMAGE_QUALITY="Качество, %"
PLG_FIELDS_MULTIMEDIA_IMAGE_QUALITY_DESC="Качество JPEG и WebP при пересохранении. Рекомендуется 80–90. Пересохранение удаляет из файла метаданные (EXIF, геометки)."
PLG_FIELDS_MULTIMEDIA_IMAGE_WEBP="Преобразовывать в WebP"
PLG_FIELDS_MULTIMEDIA_IMAGE_WEBP_DESC="Загруженные JPEG и PNG сохраняются в WebP (нужна поддержка WebP в PHP). Анимированные GIF не меняются. Изображения, выбранные из менеджера медиа, не преобразуются."
PLG_FIELDS_MULTIMEDIA_GALLERY_LAYOUT="Вид галереи"
PLG_FIELDS_MULTIMEDIA_GALLERY_LAYOUT_GRID="Сетка"
PLG_FIELDS_MULTIMEDIA_GALLERY_LAYOUT_SLIDER="Слайдер"
PLG_FIELDS_MULTIMEDIA_COLUMNS="Колонок на широком экране"
PLG_FIELDS_MULTIMEDIA_COLUMNS_DESC="На планшете выводится не более двух колонок, на телефоне — одна."
PLG_FIELDS_MULTIMEDIA_THUMB_WIDTH="Ширина миниатюры, px"
PLG_FIELDS_MULTIMEDIA_THUMB_HEIGHT="Высота миниатюры, px"
PLG_FIELDS_MULTIMEDIA_THUMB_DESC="Миниатюры создаются при первом показе и кэшируются в images/multimedia-cache. Укажите ширину 0, чтобы выводить оригиналы."
PLG_FIELDS_MULTIMEDIA_SHOW_CAPTIONS="Показывать подписи под изображениями"
PLG_FIELDS_MULTIMEDIA_LIGHTBOX="Просмотр крупно по клику"
PLG_FIELDS_MULTIMEDIA_LIGHTBOX_DESC="Если на сайте включён плагин WT Fancybox, изображения открываются через него. Иначе используется встроенное окно просмотра. Внешние сети (CDN) не подключаются."
PLG_FIELDS_MULTIMEDIA_SLIDER_AUTOPLAY="Автопрокрутка, секунд"
PLG_FIELDS_MULTIMEDIA_SLIDER_AUTOPLAY_DESC="0 — выключена. Останавливается при наведении и при включённой системной настройке «уменьшить движение»."
PLG_FIELDS_MULTIMEDIA_FILE_EXTENSIONS="Допустимые расширения"
PLG_FIELDS_MULTIMEDIA_FILE_EXTENSIONS_DESC="Через запятую, без точек. Исполняемые и активные типы (php, html, svg, js, exe и подобные) отклоняются всегда."
PLG_FIELDS_MULTIMEDIA_FILES_LAYOUT="Вид списка"
