PLG_FIELDS_MULTIMEDIA_DOWNLOAD="Действие по клику"
PLG_FIELDS_MULTIMEDIA_DOWNLOAD_DESC="Открыть — файл открывается в новой вкладке (PDF, изображения). Скачать — браузер сразу сохраняет файл."
